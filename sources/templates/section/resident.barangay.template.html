<div id="resident-barangay" data-controller="ResidentsBarangayController" style="height:100%;">
	<div style="width:100%;height:100%;">
		<div style="width:100%;height:5%;">
			<B>BARANGAY SETUP</B>
		</div>
		<div style="width:100%;height:95%;">
			<div style="height:10%;width:100%">
				<div style="width:40%;float:left">
					BARANGAY<br>
					<input data-valuectrl="BARANGAY_NAME" data-event="ResidentsBarangayController.change.changeFilter" type="text" class="form-control" />
				</div>
				<div style="width:40%;float:left;padding-left:0.5%;">
					BARANGAY CAPTAIN&nbsp; <a href="javascript:void(0);" data-event="ResidentsBarangayController.click.removeCaptain" style="color:red;font-weight:bold;"><span class="icon-remove"></span> Remove</a> <br>
					<input data-valuectrl="BARANGAY_CAPTAIN_NAME" data-event="ResidentsBarangayController.click.chooseCaptain" type="text" class="form-control" />
                </div>
				<div style="width:10%;float:left;padding-left:0.5%;">
					<div style="width:70%;float:left">
						Actions<br>
						<button class="btn btn-primary"  data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
							<b><i class="icon-caret-down"></i> Actions</b>
						</button>
						<div class="dropdown-menu dropdown-menu-left" id="dt-dp-actions">
							<a data-event="ResidentsBarangayController.click.openBarangay"  href="javascript:void(0);" class="dropdown-item"><b><i class="icon-plus"></i> New Barangay</b></a>
							<a data-event="ResidentsBarangayController.click.newTransaction" data-params='{"TYPE":""}' href="javascript:void(0);" class="dropdown-item"><b><i class="icon-refresh"></i> Refresh Table</b></a>
						</div>
					</div>
				</div>
				<div style="clear:both"></div>
			</div>
			<div class="resident-table-container" style="height:90%;border:1px solid #ccc;">
				<div id="dt-table" style="height:100%;"></div>
			</div>
		</div>
	</div>
</div>
